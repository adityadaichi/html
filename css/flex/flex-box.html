<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    .container {
        height: 60vh;
        border: 2px solid rgb(146, 130, 10);
        /* padding: 20px; */
        display: flex;
        /* flex-direction: column; */
        /* justify-content: space-evenly; */
        align-items: flex-start;
        /* column-gap: 10px;
        row-gap: 30px; */
        gap: 10px 20px;
        flex-wrap: wrap;
        align-content: flex-start;





    }

    .box {
        /* height: 200px; */
        width: 49%;
        font-size: 30px;
        text-align: center;
    }

    #box1 {
        background-color: red;
    }

    #box2 {
        background-color: rgb(166, 255, 0);
    }

    #box3 {
        background-color: rgb(27, 149, 197);
        font-size: 60px;
    }

    #box4 {
        background-color: rgb(143, 11, 166);
    }
</style>

<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>
</body>

</html>
