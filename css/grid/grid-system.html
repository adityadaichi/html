<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid System</title>
</head>
<style>
    * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
    }

    body {
        margin: 30px;
    }

    .main {
        width: 100%;
        border: 1px solid red;
        display: grid;
        grid-template-rows: 300px;
        grid-auto-rows: 200px;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 10px;

    }

    .sub {
        /* height: 200px; */
        /* background-color: red; */
        border: 2px solid rgb(95, 37, 37);

    }

    .box1 {
        background-color: aqua;
        /* grid-column-start: 1;
        grid-column-end: 3; */
        grid-area: 1 / 1 / 5 / 3;
    }

    .box2 {
        background-color: rgb(210, 255, 29);
        /* grid-column-start: 3;
        grid-row-start: 3;
        grid-row-end: 3; */
    }

    .box3 {
        background-color: rgb(176, 71, 6);
    }

    .box4 {
        background-color: rgb(223, 37, 236);
    }

    .box5 {
        background-color: rgb(6, 71, 251);
    }

    .box6 {
        background-color: rgb(255, 0, 0);
    }
</style>

<body>
    <div class="main">
        <div class="sub box1"></div>
        <div class="sub box2"></div>
        <div class="sub box3"></div>
        <div class="sub box4"></div>
        <div class="sub box5"></div>
        <div class="sub box6"></div>
        <div class="sub box7"></div>
        <div class="sub box8"></div>
        <div class="sub box9"></div>

    </div>
</body>

</html>
